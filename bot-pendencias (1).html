<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot de Pendências - Manutenção Elétrica</title>
<style>
  :root {
    --bg: #f6f8fb;
    --card: #ffffff;
    --border: #e3e8ef;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #1e40af;
    --primary-fg: #ffffff;
    --primary-soft: #e0e7ff;
    --user: #1e40af;
    --shadow: 0 1px 3px rgba(15,23,42,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--bg); }
  .app { display:flex; flex-direction:column; height:100dvh; max-width: 720px; margin: 0 auto; background: var(--bg); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); background:#fff; }
  header .title { display:flex; gap:10px; align-items:center; }
  header .avatar { width:36px; height:36px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  header h1 { font-size:14px; margin:0; }
  header p { font-size:12px; color:var(--muted); margin:0; }
  button.btn { cursor:pointer; border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:8px; font-size:13px; }
  button.btn:hover { background:#f1f5f9; }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  button.primary:hover { filter: brightness(1.1); }
  button.chip { display:inline-block; background:#fff; border:1px solid #c7d2fe; color:var(--text); padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; margin:3px; }
  button.chip:hover { background: var(--primary); color:#fff; border-color: var(--primary); }
  button.chip:disabled { opacity:.5; cursor:not-allowed; }
  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row.user { justify-content:flex-end; }
  .bubble { max-width:85%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; box-shadow: var(--shadow); white-space:pre-wrap; word-wrap:break-word; }
  .bot .bubble { background: #fff; border-bottom-left-radius:4px; }
  .user .bubble { background: var(--user); color:#fff; border-bottom-right-radius:4px; }
  .miniavatar { width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
  .user .miniavatar { background:#cbd5e1; color:#334155; }
  .options { margin-top:8px; }
  .resultado { margin-top:10px; background:#f8fafc; border:1px solid var(--border); padding:10px; border-radius:10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; white-space:pre-wrap; }
  .actions { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  footer { border-top:1px solid var(--border); padding:10px; background:#fff; display:flex; gap:8px; align-items:flex-end; }
  footer input, footer textarea { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font:inherit; font-size:14px; outline:none; resize:none; }
  footer input:focus, footer textarea:focus { border-color: var(--primary); }
  .toast { position:fixed; top:16px; right:16px; background:#0f172a; color:#fff; padding:10px 14px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(-10px); transition:.2s; z-index:50; }
  .toast.show { opacity:1; transform:translateY(0); }
  strong { font-weight:700; }
  em { color: var(--muted); font-style:italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <div class="avatar">⚡</div>
      <div>
        <h1>Bot de Pendências</h1>
        <p>Manutenção Elétrica</p>
      </div>
    </div>
    <button class="btn" id="btnReset">↻ Reiniciar</button>
  </header>
  <div class="messages" id="messages"></div>
  <footer>
    <input id="input" placeholder="Digite a resposta..." autocomplete="off" />
    <button class="btn primary" id="btnSend">Enviar</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const EQUIPAMENTOS = {
  "Chave Danificada": [
    "CHAVE FACA 15 KV 400A",
    "CHAVE FUSIVEL 15 KV, 100 A, 2000 A, BASE C",
    "CHAVE FUSIVEL 15 KV, 50 A, 1200 A",
    "CHAVE FUSIVEL 25,8 KV, 100 A, 6300 A, BASE C",
    "CHAVE FUSIVEL 34,5 KV, 100 A, 5 KA, 20.000 A",
    "CHAVE FUSIVEL 15 KV, 100 A, 4000 A",
  ],
  "Cruzeta Danificada": [
    "CRUZETA 'L', COMPRIMENTO 1700 MM",
    "CRUZETA 'T', COMPRIMENTO 2100 MM",
    "CRUZETA 'L', COMPRIMENTO 900 MM",
  ],
  "Poste Danificado": [
    "POSTE CONC. ARM DT 100/8 MTS","POSTE CONC. ARM DT 150/9 MTS","POSTE CONC. ARM DT 150/10 MTS",
    "POSTE CONC. ARM DT 200/9 MTS","POSTE CONC. ARM DT 200/10 MTS","POSTE CONC. ARM DT 200/11 MTS",
    "POSTE CONC. ARM DT 300/8 MTS","POSTE CONC. ARM DT 300/9 MTS","POSTE CONC. ARM DT 300/10 MTS",
    "POSTE CONC. ARM DT 300/11 MTS","POSTE CONC. ARM DT 300/13 MTS","POSTE CONC. ARM DT 400/9 MTS",
    "POSTE CONC. ARM DT 400/11 MTS","POSTE CONC. ARM DT 400/12 MTS","POSTE CONC. ARM DT 500/10 MTS",
    "POSTE CONC. ARM DT 500/11 MTS","POSTE CONC. ARM DT 500/12 MTS","POSTE CONC. ARM DT 500/13 MTS",
    "POSTE CONC. ARM DT 600/13 MTS",
  ],
  "Rede Partida": [
    "CABOS NUS ALUMINIO 4 AWG TIPO CA, 7 FIOS","CABOS NUS ALUMINIO 2 AWG TIPO CA, 7 FIOS",
    "CABOS NUS ALUMINIO 2 AWG TIPO CAA, 7 FIOS","CABOS NUS ALUMINIO 1/0 AWG TIPO CA, 7 FIOS",
    "CABOS NUS ALUMINIO 1/0 AWG TIPO CAA, 7 FIOS","CABOS NUS ALUMINIO 2/0 AWG TIPO CAA, 7 FIOS",
    "CABOS NUS ALUMINIO 4/0 AWG TIPO CA, 7 FIOS","CABOS NUS ALUMINIO 4/0 AWG TIPO CAA, 7 FIOS",
    "CABOS NUS ALUMINIO 336,4 MCM TIPO CA, 19 FIOS","CABOS NUS ALUMINIO 336,4 MCM TIPO CAA, 26/7 FIOS",
    "CABOS NUS ALUMINIO 477 MCM TIPO CAA, 26/7 FIOS","CABOS NUS ALUMINIO 636 MCM TIPO CAA, 26 FIOS",
    "REDE MULTIPLEX",
  ],
  "Transformador Avariado": [
    "TRANSFORMADOR 5 KVA, 15 KV","TRANSFORMADOR 5 KVA, 34,5 KV","TRANSFORMADOR 10 KVA, 15 KV",
    "TRANSFORMADOR 10 KVA, 34,5 KV, 440/220 V","TRANSFORMADOR 15 KVA, 15 KV","TRANSFORMADOR 15 KVA, 34,5 KV",
    "TRANSFORMADOR MONO 15 KVA, 7.9 KV","TRANSFORMADOR 30 KVA, 15 KV","TRANSFORMADOR 30 KVA, 34,5 KV",
    "TRANSFORMADOR 45 KVA, 15 KV","TRANSFORMADOR 45 KVA, 34,5 KV","TRANSFORMADOR 75 KVA, 15 KV",
    "TRANSFORMADOR 75 KVA, 34,5 KV","TRANSFORMADOR 112,5 KVA, 15 KV","TRANSFORMADOR 150 KVA, 15 KV",
    "TRANSFORMADOR 150 KVA, 34,5 KV","TRANSFORMADOR 225 KVA, 15 KV","TRANSFORMADOR 500 KVA, 14,4 KV",
    "TRANSFORMADOR SERVIÇOS AUXILIARES, 75 KVA, 15 KV",
  ],
  "Cliente Telemedido": [
    "Medidor Eletrônico Monofásico","Medidor Eletrônico Bifásico","Medidor Eletrônico Trifásico","Medidor de Demanda",
  ],
  "Pendência de Poda": [],
  "Sem Acesso": ["Portão Trancado","Cão Bravo","Cliente Ausente","Área de Risco"],
  "Outros": ["Especificar na Observação"],
};
const TIPOS = Object.keys(EQUIPAMENTOS);
const TIPOS_SEM_QUANTIDADE = ["Sem Acesso","Cliente Telemedido","Pendência de Poda","Outros"];
const TIPOS_COM_MATERIAIS = ["Cruzeta Danificada","Poste Danificado","Rede Partida","Transformador Avariado","Cliente Telemedido","Outros"];
const pedeQuantidade = (t) => !TIPOS_SEM_QUANTIDADE.includes(t);

const TRAFO_ORDER = ["trafo_tipo","trafo_teste_vazio","trafo_marca","trafo_numero","trafo_fab","trafo_pri","trafo_sec","trafo_obs"];
const TRAFO_LABELS = {
  trafo_tipo: "⚡ **TIPO TRANSFORMADOR** (monofásico, bifásico ou trifásico)?",
  trafo_teste_vazio: "🧪 **TESTE EM VAZIO** no transformador?",
  trafo_marca: "Qual a **MARCA** do transformador?",
  trafo_numero: "Qual o **Nº** do transformador?",
  trafo_fab: "Qual a **FABRICAÇÃO** (ano)?",
  trafo_pri: "Qual a **TENSÃO PRIMARIA**?",
  trafo_sec: "Qual a **TENSÃO SECUNDARIA**?",
  trafo_obs: "**MATERIAIS/INFO ADICIONAIS** do transformador?",
};
const TRAFO_OPTS = {
  trafo_tipo: ["Monofásico","Bifásico","Trifásico"],
  trafo_teste_vazio: ["Sim","Não","Não se aplica"],
  trafo_pri: ["7,9 kV","13,8 kV","19,9 kV","34,5 kV"],
  trafo_sec: ["220 V","380/220 V","440/220 V"],
};
const TRAFO_KEY = {
  trafo_marca:"marca", trafo_numero:"numero", trafo_tipo:"tipo", trafo_fab:"fabricacao",
  trafo_pri:"tensaoPri", trafo_sec:"tensaoSec", trafo_obs:"observacao", trafo_teste_vazio:"testeVazio",
};

const state = {
  step:"ocorrencia", ocorrencia:"", tipo:"", equipamento:"", quantidade:"",
  trafo:{marca:"",numero:"",tipo:"",fabricacao:"",tensaoPri:"",tensaoSec:"",observacao:"",testeVazio:""},
  obsGeral:"", clientesIsolados:"", acesso:"", responsavel:"",
};

const $messages = document.getElementById("messages");
const $input = document.getElementById("input");
const $btnSend = document.getElementById("btnSend");
const $btnReset = document.getElementById("btnReset");
const $toast = document.getElementById("toast");

function toast(msg){ $toast.textContent=msg; $toast.classList.add("show"); setTimeout(()=>$toast.classList.remove("show"),1800); }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function renderText(text){
  return escapeHtml(text)
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/_([^_]+)_/g,"<em>$1</em>");
}
function scroll(){ $messages.scrollTop = $messages.scrollHeight; }

function pushBot(text, opts){
  const row = document.createElement("div");
  row.className = "row bot";
  row.innerHTML = `<div class="miniavatar">⚡</div><div class="bubble"><div>${renderText(text)}</div></div>`;
  if (opts && opts.length){
    const wrap = document.createElement("div"); wrap.className="options";
    opts.forEach(o => {
      const b = document.createElement("button");
      b.className="chip"; b.textContent=o;
      b.onclick = ()=> handleOption(o);
      wrap.appendChild(b);
    });
    row.querySelector(".bubble").appendChild(wrap);
  }
  $messages.appendChild(row); scroll();
}
function pushUser(text){
  const row = document.createElement("div");
  row.className="row user";
  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="miniavatar">👤</div>`;
  $messages.appendChild(row); scroll();
}
function pushResultado(texto){
  const row = document.createElement("div");
  row.className="row bot";
  row.innerHTML = `<div class="miniavatar">⚡</div><div class="bubble"><div>${renderText("✅ Pendência registrada! Aqui está o texto formatado:")}</div></div>`;
  const card = document.createElement("div"); card.className="resultado"; card.textContent=texto;
  const acts = document.createElement("div"); acts.className="actions";
  acts.innerHTML = `
    <button class="btn primary" data-act="copy">📋 Copiar</button>
    <button class="btn" data-act="outlook">📧 Outlook</button>
    <button class="btn" data-act="wpp">💬 WhatsApp</button>
    <button class="btn" data-act="reset">↻ Nova</button>
  `;
  acts.querySelector('[data-act=copy]').onclick = ()=>{ navigator.clipboard.writeText(texto).then(()=>toast("Texto copiado!")); };
  acts.querySelector('[data-act=wpp]').onclick = ()=>{ navigator.clipboard.writeText(texto).then(()=>toast("Pronto para colar no WhatsApp!")); };
  acts.querySelector('[data-act=outlook]').onclick = ()=>{
    const assunto = `Pendência ${state.tipo} - Ocorrência ${state.ocorrencia}`;
    const url = `https://outlook.office.com/mail/deeplink/compose?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(texto)}`;
    window.open(url,"_blank","noopener,noreferrer");
  };
  acts.querySelector('[data-act=reset]').onclick = reiniciar;
  row.querySelector(".bubble").appendChild(card);
  row.querySelector(".bubble").appendChild(acts);
  $messages.appendChild(row); scroll();
}
function pushSkip(){
  const row = document.createElement("div");
  row.className="options";
  row.style.marginLeft="36px";
  const b = document.createElement("button");
  b.className="chip"; b.textContent="Pular"; b.onclick=handleSkip;
  row.appendChild(b);
  $messages.appendChild(row); scroll();
}

function montarTextoFinal(){
  const v = s => (s && s.trim()) ? s.trim() : "";
  const tp = state.tipo, eq = state.equipamento, trf = state.trafo;
  const isTelemedido = tp==="Cliente Telemedido";
  const isTrafo = tp==="Transformador Avariado";
  const incluiMateriais = TIPOS_COM_MATERIAIS.includes(tp);
  const linhas = [];
  linhas.push(`TIPO DE PENDENCIA: ${tp}`);
  if (tp !== "Pendência de Poda") linhas.push(`NECESSÁRIO PROVIDENCIAR: ${v(eq)}`);
  if (isTrafo){ linhas.push(`TESTE EM VAZIO: ${v(trf.testeVazio)}`); linhas.push(`TIPO TRANSFORMADOR: ${v(trf.tipo)}`); }
  if (pedeQuantidade(tp)) linhas.push(`QUANTIDADE DE PEÇAS: ${v(state.quantidade)}`);
  linhas.push(`${isTelemedido?"CLIENTES AFETADOS":"CLIENTES ISOLADOS"}: ${v(state.clientesIsolados)}`);
  if (isTrafo){
    linhas.push(`DADOS DO TRANSFORMADOR:`);
    linhas.push(`  MARCA: ${v(trf.marca)}`);
    linhas.push(`  Nº: ${v(trf.numero)}`);
    linhas.push(`  FABRICAÇÃO: ${v(trf.fabricacao)}`);
    linhas.push(`  TENSÃO PRIMARIA: ${v(trf.tensaoPri)}`);
    linhas.push(`  TENSÃO SECUNDARIA: ${v(trf.tensaoSec)}`);
  }
  if (incluiMateriais){
    const extra = isTrafo ? [v(state.obsGeral), v(trf.observacao)].filter(Boolean).join(" | ") : v(state.obsGeral);
    linhas.push(`MATERIAIS/INFO ADICIONAIS: ${extra}`);
  }
  linhas.push(`ACESSO: ${v(state.acesso)}`);
  linhas.push(`RESPONSAVEL ACIONADO NA REGIONAL: ${v(state.responsavel)}`);
  return linhas.join("\n");
}

function askNextTrafo(next){
  state.step = next;
  const opts = TRAFO_OPTS[next];
  pushBot(`${TRAFO_LABELS[next]}\n\n_(toque em uma opção, digite ou "Pular")_`, opts);
  pushSkip();
}

function handleSubmit(raw){
  const value = (raw||"").trim();
  if (!value && state.step !== "observacao") return;
  pushUser(value || "(em branco)");

  if (state.step==="ocorrencia"){
    state.ocorrencia = value; state.step="tipo";
    pushBot("Perfeito. Agora selecione o **TIPO DE PENDENCIA**:", TIPOS); return;
  }
  if (state.step==="observacao"){
    state.obsGeral = value; state.step="clientes_isolados";
    pushBot("👥 Quantos **CLIENTES ISOLADOS**? (digite um número, ou `0` se nenhum)"); return;
  }
  if (state.step==="clientes_isolados"){
    state.clientesIsolados = value; state.step="acesso";
    pushBot("🚪 Qual o **ACESSO**?", ["Com Acesso","Sem Acesso"]); return;
  }
  if (state.step==="acesso"){
    state.acesso = value; state.step="responsavel";
    pushBot("👤 Quem foi o **RESPONSAVEL ACIONADO NA REGIONAL**?"); return;
  }
  if (state.step==="responsavel"){
    state.responsavel = value; state.step="final";
    pushResultado(montarTextoFinal()); return;
  }
  if (state.step==="quantidade"){
    state.quantidade = value;
    if (state.tipo==="Transformador Avariado") askNextTrafo("trafo_tipo");
    else { state.step="observacao"; pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)"); }
    return;
  }
  if (state.step.startsWith("trafo_")){
    state.trafo[TRAFO_KEY[state.step]] = value;
    const idx = TRAFO_ORDER.indexOf(state.step);
    if (idx < TRAFO_ORDER.length-1) askNextTrafo(TRAFO_ORDER[idx+1]);
    else { state.step="observacao"; pushBot("Anotado! 📝 **MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)"); }
    return;
  }
}

function handleOption(opt){
  pushUser(opt);
  if (state.step==="acesso"){
    state.acesso = opt; state.step="responsavel";
    pushBot("👤 Quem foi o **RESPONSAVEL ACIONADO NA REGIONAL**?"); return;
  }
  if (state.step==="tipo"){
    state.tipo = opt; state.equipamento="";
    if (opt==="Pendência de Poda"){
      state.step="observacao";
      pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)");
    } else {
      state.step="equipamento";
      pushBot(`Selecione o **NECESSÁRIO PROVIDENCIAR** para "${opt}":`, EQUIPAMENTOS[opt]);
    }
    return;
  }
  if (state.step==="equipamento"){
    state.equipamento = opt;
    if (pedeQuantidade(state.tipo)){
      state.step="quantidade";
      pushBot("🔢 Qual a **QUANTIDADE DE PEÇAS** que devem ser providenciadas?");
    } else if (state.tipo==="Transformador Avariado"){
      askNextTrafo("trafo_tipo");
    } else {
      state.step="observacao";
      pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)");
    }
    return;
  }
  if (state.step.startsWith("trafo_")){
    state.trafo[TRAFO_KEY[state.step]] = opt;
    const idx = TRAFO_ORDER.indexOf(state.step);
    if (idx < TRAFO_ORDER.length-1) askNextTrafo(TRAFO_ORDER[idx+1]);
    else { state.step="observacao"; pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)"); }
    return;
  }
}

function handleSkip(){
  if (!state.step.startsWith("trafo_")) return;
  pushUser("(pulado)");
  const idx = TRAFO_ORDER.indexOf(state.step);
  if (idx < TRAFO_ORDER.length-1) askNextTrafo(TRAFO_ORDER[idx+1]);
  else { state.step="observacao"; pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)"); }
}

function reiniciar(){
  $messages.innerHTML="";
  Object.assign(state, {
    step:"ocorrencia", ocorrencia:"", tipo:"", equipamento:"", quantidade:"",
    trafo:{marca:"",numero:"",tipo:"",fabricacao:"",tensaoPri:"",tensaoSec:"",observacao:"",testeVazio:""},
    obsGeral:"", clientesIsolados:"", acesso:"", responsavel:"",
  });
  $input.value="";
  pushBot("Olá! 👷‍♂️ Sou o bot de pendências de manutenção elétrica. Vou te guiar passo a passo.\n\nQual é o **número da ocorrência**?");
}

$btnSend.onclick = ()=>{ handleSubmit($input.value); $input.value=""; $input.focus(); };
$input.addEventListener("keydown",(e)=>{ if (e.key==="Enter"){ e.preventDefault(); handleSubmit($input.value); $input.value=""; } });
$btnReset.onclick = reiniciar;

reiniciar();
</script>
</body>
</html>
