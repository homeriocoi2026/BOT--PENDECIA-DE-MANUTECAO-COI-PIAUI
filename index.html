<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bot de Pendências - Manutenção Elétrica</title>
<style>
  :root{
    --bg:#0b1020; --card:#111833; --muted:#8aa0c8; --fg:#eaf0ff;
    --primary:#3b82f6; --primary-fg:#fff; --border:#1f2a4a;
    --user:#2563eb; --bot:#1a2347;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:linear-gradient(135deg,#0b1020,#0f1838);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(17,24,51,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:10px}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700}
  h1{font-size:14px;margin:0}
  .sub{font-size:11px;color:var(--muted)}
  button{cursor:pointer;font:inherit}
  .btn{background:var(--primary);color:var(--primary-fg);border:none;border-radius:10px;padding:8px 12px;font-size:13px}
  .btn.secondary{background:#26315a;color:var(--fg)}
  .btn.outline{background:transparent;border:1px solid var(--border);color:var(--fg)}
  .btn.ghost{background:transparent;color:var(--fg);border:none}
  main{max-width:780px;margin:0 auto;display:flex;flex-direction:column;height:calc(100dvh - 58px)}
  .messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px}
  .msg{display:flex;align-items:flex-end;gap:8px}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .msg.bot .bubble{background:var(--bot);border-bottom-left-radius:4px}
  .msg.user .bubble{background:var(--user);border-bottom-right-radius:4px;color:#fff}
  .miniavatar{width:28px;height:28px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .msg.user .miniavatar{background:#26315a}
  .options{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:transparent;border:1px solid rgba(59,130,246,.5);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500}
  .chip:hover:not(:disabled){background:var(--primary)}
  .chip:disabled{opacity:.4;cursor:not-allowed}
  .resultcard{margin-top:10px;background:#0b1020;border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:12px}
  .resultcard pre{margin:0 0 10px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-wrap:break-word;color:#dde6ff}
  .resultcard .actions{display:flex;flex-wrap:wrap;gap:6px}
  footer{border-top:1px solid var(--border);padding:10px 12px;background:rgba(17,24,51,.85)}
  .inputrow{display:flex;gap:8px;align-items:flex-end;max-width:780px;margin:0 auto}
  input,textarea{flex:1;background:#0b1020;color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
  input:focus,textarea:focus{border-color:var(--primary)}
  textarea{min-height:48px;resize:vertical}
  strong{color:#fff}
  em{color:var(--muted);font-style:normal;font-size:12px}
  .summary{font-size:11px;color:var(--muted);margin-left:36px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="avatar">🤖</div>
    <div>
      <h1>Bot de Pendências</h1>
      <div class="sub">Manutenção Elétrica</div>
    </div>
  </div>
  <button class="btn ghost" onclick="reiniciar()">↻ Reiniciar</button>
</header>
<main>
  <div class="messages" id="messages"></div>
  <footer>
    <div class="inputrow">
      <input id="input" placeholder="Digite a resposta..." />
      <button class="btn" id="sendBtn" onclick="onSend()">➤</button>
    </div>
  </footer>
</main>

<script>
const EQUIPAMENTOS = {
  "Chave Danificada": [
    "CHAVE FACA 15 KV 400A",
    "CHAVE FUSIVEL 15 KV, 100 A, 2000 A, BASE C",
    "CHAVE FUSIVEL 15 KV, 50 A, 1200 A",
    "CHAVE FUSIVEL 25,8 KV, 100 A, 6300 A, BASE C",
    "CHAVE FUSIVEL 34,5 KV, 100 A, 5 KA, 20.000 A",
    "CHAVE FUSIVEL 15 KV, 100 A, 4000 A",
  ],
  "Cruzeta Danificada": [
    "CRUZETA 'L', COMPRIMENTO 1700 MM",
    "CRUZETA 'T', COMPRIMENTO 2100 MM",
    "CRUZETA 'L', COMPRIMENTO 900 MM",
  ],
  "Poste Danificado": [
    "POSTE CONC. ARM DT 100/8 MTS","POSTE CONC. ARM DT 150/9 MTS","POSTE CONC. ARM DT 150/10 MTS",
    "POSTE CONC. ARM DT 200/9 MTS","POSTE CONC. ARM DT 200/10 MTS","POSTE CONC. ARM DT 200/11 MTS",
    "POSTE CONC. ARM DT 300/8 MTS","POSTE CONC. ARM DT 300/9 MTS","POSTE CONC. ARM DT 300/10 MTS",
    "POSTE CONC. ARM DT 300/11 MTS","POSTE CONC. ARM DT 300/13 MTS","POSTE CONC. ARM DT 400/9 MTS",
    "POSTE CONC. ARM DT 400/11 MTS","POSTE CONC. ARM DT 400/12 MTS","POSTE CONC. ARM DT 500/10 MTS",
    "POSTE CONC. ARM DT 500/11 MTS","POSTE CONC. ARM DT 500/12 MTS","POSTE CONC. ARM DT 500/13 MTS",
    "POSTE CONC. ARM DT 600/13 MTS",
  ],
  "Rede Partida": [
    "CABOS NUS ALUMINIO 4 AWG TIPO CA, 7 FIOS","CABOS NUS ALUMINIO 2 AWG TIPO CA, 7 FIOS",
    "CABOS NUS ALUMINIO 2 AWG TIPO CAA, 7 FIOS","CABOS NUS ALUMINIO 1/0 AWG TIPO CA, 7 FIOS",
    "CABOS NUS ALUMINIO 1/0 AWG TIPO CAA, 7 FIOS","CABOS NUS ALUMINIO 2/0 AWG TIPO CAA, 7 FIOS",
    "CABOS NUS ALUMINIO 4/0 AWG TIPO CA, 7 FIOS","CABOS NUS ALUMINIO 4/0 AWG TIPO CAA, 7 FIOS",
    "CABOS NUS ALUMINIO 336,4 MCM TIPO CA, 19 FIOS","CABOS NUS ALUMINIO 336,4 MCM TIPO CAA, 26/7 FIOS",
    "CABOS NUS ALUMINIO 477 MCM TIPO CAA, 26/7 FIOS","CABOS NUS ALUMINIO 636 MCM TIPO CAA, 26 FIOS",
    "REDE MULTIPLEX",
  ],
  "Transformador Avariado": [
    "TRANSFORMADOR 5 KVA, 15 KV","TRANSFORMADOR 5 KVA, 34,5 KV","TRANSFORMADOR 10 KVA, 15 KV",
    "TRANSFORMADOR 10 KVA, 34,5 KV, 440/220 V","TRANSFORMADOR 15 KVA, 15 KV","TRANSFORMADOR 15 KVA, 34,5 KV",
    "TRANSFORMADOR MONO 15 KVA, 7.9 KV","TRANSFORMADOR 30 KVA, 15 KV","TRANSFORMADOR 30 KVA, 34,5 KV",
    "TRANSFORMADOR 45 KVA, 15 KV","TRANSFORMADOR 45 KVA, 34,5 KV","TRANSFORMADOR 75 KVA, 15 KV",
    "TRANSFORMADOR 75 KVA, 34,5 KV","TRANSFORMADOR 112,5 KVA, 15 KV","TRANSFORMADOR 150 KVA, 15 KV",
    "TRANSFORMADOR 150 KVA, 34,5 KV","TRANSFORMADOR 225 KVA, 15 KV","TRANSFORMADOR 500 KVA, 14,4 KV",
    "TRANSFORMADOR SERVIÇOS AUXILIARES, 75 KVA, 15 KV",
  ],
  "Cliente Telemedido": ["SMC","SMI"],
  "Pendência de Poda": ["PENDÊNCIA DE PODA"],
  "Sem Acesso": ["SEM ACESSO"],
  "Outros": ["OUTROS"],
};
const TIPOS = Object.keys(EQUIPAMENTOS);
const TIPOS_SEM_QUANTIDADE = ["Sem Acesso","Cliente Telemedido","Pendência de Poda","Outros"];
const pedeQuantidade = (t)=>!TIPOS_SEM_QUANTIDADE.includes(t);

const TRAFO_ORDER = ["trafo_tipo","trafo_teste_vazio","trafo_marca","trafo_numero","trafo_fab","trafo_pri","trafo_sec"];
const TRAFO_LABELS = {
  trafo_tipo: "⚡ **TIPO TRANSFORMADOR** (monofásico, bifásico ou trifásico)?",
  trafo_teste_vazio: "🧪 **TESTE EM VAZIO** no transformador?",
  trafo_marca: "Qual a **MARCA** do transformador?",
  trafo_numero: "Qual o **Nº** do transformador?",
  trafo_fab: "Qual a **FABRICAÇÃO** (ano)?",
  trafo_pri: "Qual a **TENSÃO PRIMARIA**?",
  trafo_sec: "Qual a **TENSÃO SECUNDARIA**?",
};
const TRAFO_OPTS = {
  trafo_tipo: ["Monofásico","Bifásico","Trifásico"],
  trafo_teste_vazio: ["Sim","Não","Não se aplica"],
  trafo_pri: ["7,9 kV","13,8 kV","19,9 kV","34,5 kV"],
  trafo_sec: ["220 V","380/220 V","440/220 V"],
};
const TRAFO_KEY = {
  trafo_tipo:"tipo", trafo_teste_vazio:"testeVazio", trafo_marca:"marca",
  trafo_numero:"numero", trafo_fab:"fabricacao", trafo_pri:"tensaoPri", trafo_sec:"tensaoSec",
};

let state = {};
function resetState(){
  state = {
    step:"ocorrencia", ocorrencia:"", tipo:"", equipamento:"", quantidade:"",
    obsGeral:"", clientesIsolados:"", acesso:"", responsavel:"",
    trafo:{marca:"",numero:"",tipo:"",fabricacao:"",tensaoPri:"",tensaoSec:"",testeVazio:""},
  };
}
resetState();

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");

function renderText(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/_([^_]+)_/g,"<em>$1</em>");
}

function pushMsg(from,text,opts,result){
  const wrap=document.createElement("div");
  wrap.className="msg "+from;
  const av=`<div class="miniavatar">${from==="bot"?"🤖":"👤"}</div>`;
  let optsHtml="";
  if(opts && opts.length){
    optsHtml='<div class="options">'+opts.map(o=>`<button class="chip" onclick="onOption(${JSON.stringify(o).replace(/"/g,'&quot;')})">${o.replace(/</g,"&lt;")}</button>`).join("")+'</div>';
  }
  let resHtml="";
  if(result){
    const safe=result.replace(/</g,"&lt;");
    const escaped=result.replace(/`/g,"\\`").replace(/\$/g,"\\$");
    resHtml=`<div class="resultcard"><pre>${safe}</pre><div class="actions">
      <button class="btn" onclick="copiar(\`${escaped}\`)">📋 Copiar</button>
      <button class="btn secondary" onclick="abrirOutlook(\`${escaped}\`)">✉️ Outlook</button>
      <button class="btn secondary" onclick="copiar(\`${escaped}\`,'Pronto para colar no WhatsApp!')">💬 WhatsApp</button>
      <button class="btn outline" onclick="reiniciar()">↻ Nova</button>
    </div></div>`;
  }
  const bubble=`<div class="bubble">${renderText(text)}${optsHtml}${resHtml}</div>`;
  wrap.innerHTML = from==="user" ? bubble+av : av+bubble;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

function pushBot(t,o,r){pushMsg("bot",t,o,r)}
function pushUser(t){pushMsg("user",t)}

function setPlaceholder(){
  const m={
    ocorrencia:"Digite o número da ocorrência...",
    tipo:"Toque em uma opção acima",
    equipamento:"Toque em uma opção acima",
    quantidade:"Quantidade de peças (ex.: 1, 2, 3)",
    observacao:"Digite a observação ou - para pular",
    clientes_isolados:"Quantidade de clientes isolados (ex.: 0, 5, 12)",
    acesso:"Descreva as condições de acesso...",
    responsavel:"Nome do responsável na regional...",
    final:"Atendimento concluído",
  };
  const dis=["tipo","equipamento","final"].includes(state.step);
  inputEl.placeholder = m[state.step] || (state.step.startsWith("trafo_") ? "Digite a resposta ou toque numa opção" : "Digite a resposta...");
  inputEl.disabled = dis;
  document.getElementById("sendBtn").disabled = dis;
}

function askNextTrafo(s){
  pushBot(TRAFO_LABELS[s], TRAFO_OPTS[s]);
}

function montarFinal(){
  const {ocorrencia:occ,tipo:tp,equipamento:eq,trafo:trf,obsGeral:obs,clientesIsolados:cli,acesso:acc,responsavel:resp,quantidade:qtd}=state;
  const TIPOS_COM_MATERIAIS=["Cruzeta Danificada","Poste Danificado","Rede Partida","Transformador Avariado","Cliente Telemedido","Sem Acesso","Pendência de Poda","Outros"];
  const incluiMateriais=TIPOS_COM_MATERIAIS.includes(tp);
  const isTelemedido=tp==="Cliente Telemedido";
  const isTrafo=tp==="Transformador Avariado";
  const v=s=>(s&&s.trim())?s.trim():"";
  const L=[];
  L.push(`OCORRENCIA: ${v(occ)}`);
  L.push(`TIPO DE PENDENCIA: ${tp}`);
  L.push(`EQUIPAMENTO: ${v(eq)}`);
  if(isTrafo){L.push(`TESTE EM VAZIO: ${v(trf.testeVazio)}`);L.push(`TIPO TRANSFORMADOR: ${v(trf.tipo)}`);}
  if(pedeQuantidade(tp))L.push(`QUANTIDADE DE PEÇAS: ${v(qtd)}`);
  L.push(`${isTelemedido?"CLIENTES AFETADOS":"CLIENTES ISOLADOS"}: ${v(cli)}`);
  if(isTrafo){
    L.push(`DADOS DO TRANSFORMADOR:`);
    L.push(`  MARCA: ${v(trf.marca)}`);
    L.push(`  Nº: ${v(trf.numero)}`);
    L.push(`  FABRICAÇÃO: ${v(trf.fabricacao)}`);
    L.push(`  TENSÃO PRIMARIA: ${v(trf.tensaoPri)}`);
    L.push(`  TENSÃO SECUNDARIA: ${v(trf.tensaoSec)}`);
  }
  if(incluiMateriais)L.push(`MATERIAIS/INFO ADICIONAIS: ${v(obs)}`);
  L.push(`ACESSO: ${v(acc)}`);
  L.push(`RESPONSAVEL ACIONADO NA REGIONAL: ${v(resp)}`);
  return L.join("\n");
}

function finalizar(){
  state.step="final";
  pushBot("✅ Pendência registrada! Aqui está o texto formatado:", null, montarFinal());
  setPlaceholder();
}

function onSend(){
  const v=inputEl.value.trim();
  if(!v && state.step!=="observacao") return;
  inputEl.value="";
  handleText(v);
}
inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();onSend();}});

function handleText(value){
  pushUser(value || "(em branco)");
  const s=state.step;
  if(s==="ocorrencia"){state.ocorrencia=value;state.step="tipo";pushBot("Perfeito. Agora selecione o **TIPO DE PENDENCIA**:",TIPOS);setPlaceholder();return;}
  if(s==="observacao"){state.obsGeral=value;state.step="clientes_isolados";pushBot("👥 Quantos **CLIENTES ISOLADOS**? (digite um número, ou `0` se nenhum)");setPlaceholder();return;}
  if(s==="clientes_isolados"){
    state.clientesIsolados=value;
    if(state.tipo==="Sem Acesso"){state.acesso="Sem Acesso";state.step="responsavel";pushBot("👤 Quem foi o **RESPONSAVEL ACIONADO NA REGIONAL**?");}
    else{state.step="acesso";pushBot("🚪 Quais as **CONDIÇÕES DE ACESSO**?",["Com Acesso","Sem Acesso"]);}
    setPlaceholder();return;
  }
  if(s==="acesso"){state.acesso=value;state.step="responsavel";pushBot("👤 Quem foi o **RESPONSAVEL ACIONADO NA REGIONAL**?");setPlaceholder();return;}
  if(s==="responsavel"){state.responsavel=value;finalizar();return;}
  if(s==="quantidade"){
    state.quantidade=value;
    if(state.tipo==="Transformador Avariado"){state.step="trafo_tipo";askNextTrafo("trafo_tipo");}
    else{state.step="observacao";pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)");}
    setPlaceholder();return;
  }
  if(s.startsWith("trafo_")){
    state.trafo[TRAFO_KEY[s]]=value;
    const idx=TRAFO_ORDER.indexOf(s);
    if(idx<TRAFO_ORDER.length-1){state.step=TRAFO_ORDER[idx+1];askNextTrafo(state.step);}
    else{state.step="observacao";pushBot("Anotado! 📝 **MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)");}
    setPlaceholder();return;
  }
}

function onOption(opt){
  pushUser(opt);
  const s=state.step;
  if(s==="acesso"){state.acesso=opt;state.step="responsavel";pushBot("👤 Quem foi o **RESPONSAVEL ACIONADO NA REGIONAL**?");setPlaceholder();return;}
  if(s==="tipo"){state.tipo=opt;state.equipamento="";state.step="equipamento";pushBot(`Selecione o **EQUIPAMENTO** para "${opt}":`,EQUIPAMENTOS[opt]);setPlaceholder();return;}
  if(s==="equipamento"){
    state.equipamento=opt;
    if(pedeQuantidade(state.tipo)){state.step="quantidade";pushBot("🔢 Qual a **QUANTIDADE DE PEÇAS** que devem ser providenciadas?");}
    else if(state.tipo==="Transformador Avariado"){state.step="trafo_tipo";askNextTrafo("trafo_tipo");}
    else{state.step="observacao";pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)");}
    setPlaceholder();return;
  }
  if(s.startsWith("trafo_")){
    state.trafo[TRAFO_KEY[s]]=opt;
    const idx=TRAFO_ORDER.indexOf(s);
    if(idx<TRAFO_ORDER.length-1){state.step=TRAFO_ORDER[idx+1];askNextTrafo(state.step);}
    else{state.step="observacao";pushBot("**MATERIAIS/INFO ADICIONAIS**? (envie um traço `-` se não houver)");}
    setPlaceholder();return;
  }
}

function copiar(t,msg){
  navigator.clipboard.writeText(t).then(()=>alert(msg||"Copiado!")).catch(()=>alert("Falha ao copiar"));
}
function abrirOutlook(t){
  const assunto=`Pendência ${state.tipo} - Ocorrência ${state.ocorrencia}`;
  const url=`https://outlook.office.com/mail/deeplink/compose?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(t)}`;
  window.open(url,"_blank","noopener,noreferrer");
}
function reiniciar(){
  resetState();
  messagesEl.innerHTML="";
  setPlaceholder();
  pushBot("Olá! 👷‍♂️ Sou o bot de pendências de manutenção elétrica. Vou te guiar passo a passo.\n\nQual é a **OCORRÊNCIA**?");
}

reiniciar();
</script>
</body>
</html>
